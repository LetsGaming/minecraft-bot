# Continuous integration — every gate the project's definition-of-done
# lists: typecheck, lint, tests, locale parity, schema drift, wire contract
# drift, dependency audit, and the dashboard frontend build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The project runs on Node 24; engines allows >= 20. better-sqlite3
          # is the default SQLite driver (src/core/db/driver.ts).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Workspace layout (src/ holds workspaces only)
        run: npm run layout:check

      - name: Locale parity (en/de)
        run: npm run i18n:check

      - name: Schema drift (config.schema.json matches the types)
        run: npm run schema:check

      # The wire types are generated from the wrapper's openapi.json, which
      # the wrapper generates from its router. The wrapper default branch is
      # checked out only to compare that file against the vendored copy.
      - name: Check out the wrapper (source of the wire contract)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: LetsGaming/minecraft-server-api
          path: api-wrapper

      - name: Wire contract drift (vendored openapi.json and generated types)
        run: npm run wire:check
        env:
          WRAPPER_DIR: ${{ github.workspace }}/api-wrapper

      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard (backend + frontend)
        run: npm run build:all

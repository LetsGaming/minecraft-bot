# Cross-repo contract: this bot against a real api-wrapper.
#
# The bot's serverAccess casts the wrapper's JSON to the caller's type, so a
# renamed field compiles here, passes the wrapper's own tests, and only shows
# up as a remote instance quietly returning undefined. Neither repo's suite
# can catch that alone; this job runs the two together.
#
# A red build here usually means the wrapper needs to land its half first —
# that ordering is the point, not a nuisance.
#
# Two legs, because two wrappers matter:
#   default  the wrapper's default branch: what the next wrapper release will be.
#   pinned   the wrapper release minecraft-server-setup pins in
#            api-server-release.json: what operators get when they update the
#            suite.
# A red pinned leg with a green default leg means the suite's pin is behind
# the wrapper this bot needs. Bump the pin (minecraft-server-setup
# docs/wrapper-release.md); the bot merges after that, not before.
name: Wrapper contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      wrapper_ref:
        description: "api-wrapper ref for the default leg (empty: its default branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The api-wrapper repo. Note the repo and the package are named differently:
  # the package is `mc-api-server`, the repo is `minecraft-server-api`.
  WRAPPER_REPO: LetsGaming/minecraft-server-api
  # Pins the wrapper release it installs in api-server-release.json.
  SETUP_REPO: LetsGaming/minecraft-server-setup

jobs:
  contract:
    name: contract (${{ matrix.wrapper }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        wrapper: [default, pinned]
    steps:
      - name: Check out the bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: bot

      # The wrapper release the suite installs, from its api-server-release.json.
      - name: Resolve the wrapper ref
        id: wrapper
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, not interpolated into the script (AUD-030): an input
          # is text, and `${{ }}` would paste it into the shell as code.
          LEG: ${{ matrix.wrapper }}
          INPUT_REF: ${{ inputs.wrapper_ref }}
        run: |
          if [ "$LEG" = "pinned" ]; then
            # The suite installs a wrapper release named in api-server-release.json
            # (it used to be a submodule); the release is the tag v<version>.
            version=$(gh api "repos/${SETUP_REPO}/contents/api-server-release.json" \
              -H "Accept: application/vnd.github.raw" | jq -r .version)
            ref="v${version}"
            echo "Suite pins ${WRAPPER_REPO}@${ref}"
          else
            ref="$INPUT_REF"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Check out the api-wrapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.WRAPPER_REPO }}
          ref: ${{ steps.wrapper.outputs.ref }}
          path: api-wrapper

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The project runs on Node 24; engines allows >= 20.
          node-version: 24

      - name: Build the bot
        working-directory: bot
        run: npm ci && npm run build

      - name: Build the wrapper
        working-directory: api-wrapper
        run: npm ci && npm run build

      - name: Contract check
        working-directory: bot
        env:
          WRAPPER_DIR: ${{ github.workspace }}/api-wrapper
          E2E_DUMP_WRAPPER_LOG: "1"
          # GitHub-hosted runners have passwordless sudo, which the wrapper
          # needs to run the suite scripts. Without it the script routes would
          # only be checked for their failure shape; here that is a failure.
          E2E_REQUIRE_SUDO: "1"
        run: |
          # Land order matters and this is the job that notices when it was
          # wrong. The check runs this branch against the wrapper's default
          # branch and against the release the suite pins, so a bot change that
          # expects a new wrapper feature fails here until the wrapper's half
          # is merged (default leg) and the suite points at it (pinned leg).
          # Correct, but the raw output reads like a broken contract rather
          # than a sequencing problem. Say which it is.
          if ! npm run e2e:contract; then
            echo "::error::Contract check failed against the ${{ matrix.wrapper }} wrapper (${{ steps.wrapper.outputs.ref }})."
            echo "This fails only on a real disagreement: a feature the bot CALLS"
            echo "that the wrapper cannot serve, or one whose contract version has"
            echo "moved under it."
            echo "A wrapper offering features this bot does not use yet is reported"
            echo "as a note, not a failure — additive wrapper features land first"
            echo "by design, and nothing calls those routes until the bot half ships."
            echo "So if you see missing FEATURES or unknown script actions here, this"
            echo "branch expects a wrapper that has not been merged yet."
            exit 1
          fi

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview - Evolve</title>
<!-- DIRECTION CONTRACT (Evolve): see direction.md. Thesis: same product, one visual language; status is the system and the state edge is the one motion. Risk: touches every view. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<aside class="mock-bar" aria-label="Mockup controls"><a href="index.html">Evolve index</a><span class="demo">Each screen at 1440 (scaled to 56%) and 390 (scaled to 80%). Pick a state per row. Open a page for the real size.</span></aside>
<main id="main" class="pv-wrap">
  <h1>Evolve preview</h1>
  <section class="pv-row" data-page="config.html"><h2>Config editor</h2>
    <label class="small">State <select class="select" style="width:auto" data-pv><option>dirty</option><option>clean</option><option>error</option><option>conflict</option><option>saving</option><option>applied</option><option>pending</option><option>botdown</option><option>readonly</option></select></label>
    <div class="pv-frames"><div class="pv-frame"><div class="pv-clip pv-clip--d"><iframe title="Config at 1440" src="config.html?state=dirty"></iframe></div><span class="pv-frame__cap">1440 x 900</span></div><div class="pv-frame"><div class="pv-clip pv-clip--m"><iframe title="Config at 390" src="config.html?state=dirty"></iframe></div><span class="pv-frame__cap">390 x 780</span></div></div></section>
  <section class="pv-row" data-page="mods.html"><h2>Mods</h2>
    <label class="small">State <select class="select" style="width:auto" data-pv><option>results</option><option>installed</option><option>loading</option><option>busy</option><option>checking</option><option>checkfailed</option><option>empty</option><option>error</option><option>remove</option></select></label>
    <div class="pv-frames"><div class="pv-frame"><div class="pv-clip pv-clip--d"><iframe title="Mods at 1440" src="mods.html?state=results"></iframe></div><span class="pv-frame__cap">1440 x 900</span></div><div class="pv-frame"><div class="pv-clip pv-clip--m"><iframe title="Mods at 390" src="mods.html?state=results"></iframe></div><span class="pv-frame__cap">390 x 780</span></div></div></section>
  <section class="pv-row" data-page="backups.html"><h2>Backups</h2>
    <label class="small">State <select class="select" style="width:auto" data-pv><option>restoring</option><option>list</option><option>loading</option><option>creating</option><option>created</option><option>rowbusy</option><option>delete</option><option>restore</option><option>restorefail</option><option>empty</option><option>error</option><option>readonly</option></select></label>
    <div class="pv-frames"><div class="pv-frame"><div class="pv-clip pv-clip--d"><iframe title="Backups at 1440" src="backups.html?state=restoring"></iframe></div><span class="pv-frame__cap">1440 x 900</span></div><div class="pv-frame"><div class="pv-clip pv-clip--m"><iframe title="Backups at 390" src="backups.html?state=restoring"></iframe></div><span class="pv-frame__cap">390 x 780</span></div></div></section>
  <section class="pv-row" data-page="discord.html"><h2>Discord</h2>
    <div class="pv-frames"><div class="pv-frame"><div class="pv-clip pv-clip--d"><iframe title="Discord at 1440" src="discord.html"></iframe></div><span class="pv-frame__cap">1440 x 900</span></div><div class="pv-frame"><div class="pv-clip pv-clip--m"><iframe title="Discord at 390" src="discord.html"></iframe></div><span class="pv-frame__cap">390 x 780</span></div></div></section>
</main>
<script src="app.js"></script>
<script>
document.querySelectorAll("[data-pv]").forEach(function (s) {
  s.addEventListener("change", function () {
    var row = s.closest("[data-page]"), p = row.getAttribute("data-page");
    row.querySelectorAll("iframe").forEach(function (f) { f.src = p + "?state=" + s.value; });
  });
});
</script>
</body>
</html>

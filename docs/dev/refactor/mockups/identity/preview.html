<!doctype html>
<html lang="en" data-ui-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview - identity mockups</title>
<link rel="stylesheet" href="style.css">
<!--
THESIS: Side-by-side review of every screen at the two widths that matter.
WORLD: Plain frames on the same graphite ground; the product UI is inside the iframes.
STORY: The owner scans all screens at desktop and mobile in under two minutes.
FIRST VIEWPORT: Screen picker row, then the first screen's two frames.
RISK: Scaled iframes hide 1:1 pixel detail; open the page itself to judge type and spacing.
-->
<style>
  .pv { display: grid; grid-template-columns: auto auto; gap: var(--space-5); align-items: start; justify-content: start; margin-bottom: var(--space-7); overflow-x: auto; }
  .frame { border: 1px solid var(--border-strong); border-radius: var(--radius-2); overflow: hidden; background: var(--surface-canvas); }
  .frame iframe { border: 0; display: block; transform-origin: 0 0; background: #000; }
  .cap { color: var(--text-dim); font-size: var(--text-sm); margin-bottom: var(--space-1); }
</style>
</head>
<body>
<main id="main" class="main">
<div class="page" style="max-width:none">
<div class="page-head"><div><h1>Preview</h1><p>Desktop frame is 1440 by 900, mobile 390 by 844, both scaled to fit. Pick a state with the selector inside each frame, or set it here.</p></div>
<div class="toolbar"><label for="sc">Scale</label><select class="input short" id="sc"><option value="0.5">50%</option><option value="0.6" selected>60%</option><option value="0.75">75%</option></select><a class="btn" href="index.html">Index</a></div></div>
<div id="out"></div>
</div>
</main>
<script>
  var screens = [
    ["Watch", "watch.html?state=attention", "watch.html?state=attention"],
    ["Settings, dirty", "config.html?state=dirty", "config.html?state=dirty"],
    ["Settings, validation error", "config.html?state=invalid", "config.html?state=invalid"],
    ["Mods, results with blockers", "mods.html?state=blockers", "mods.html?state=blockers"],
    ["Mods, checking 14 of 62", "mods.html?state=checking", "mods.html?state=checking"],
    ["Backups, restore confirmation", "backups.html?state=restore", "backups.html?state=restore"],
    ["Backups, list", "backups.html?state=list", "backups.html?state=list"],
    ["Discord messages", "discord.html", "discord.html"]
  ];
  function draw() {
    var s = parseFloat(document.getElementById("sc").value), h = "";
    screens.forEach(function (r) {
      h += '<section class="section"><header><h2>' + r[0] + '</h2><a href="' + r[1] + '">Open page</a></header><div class="pv">' +
        '<div><div class="cap">Desktop 1440</div><div class="frame" style="width:' + 1440 * s + "px;height:" + 900 * s + 'px"><iframe title="' + r[0] + ' desktop" src="' + r[1] + '" width="1440" height="900" style="transform:scale(' + s + ')"></iframe></div></div>' +
        '<div><div class="cap">Mobile 390</div><div class="frame" style="width:' + 390 * s + "px;height:" + 844 * s + 'px"><iframe title="' + r[0] + ' mobile" src="' + r[2] + '" width="390" height="844" style="transform:scale(' + s + ')"></iframe></div></div></div></section>';
    });
    document.getElementById("out").innerHTML = h;
  }
  document.getElementById("sc").addEventListener("change", draw); draw();
</script>
</body>
</html>
